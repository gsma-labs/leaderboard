name: Validate Leaderboard Submission

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open PR number to validate at its current head'
        required: true
        type: string

permissions:
  contents: read
  statuses: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted main scripts
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install trusted dependencies
        run: pip install -r trusted/.github/scripts/requirements.txt
      - name: Validate immutable PR data and report exact-head status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python trusted/.github/scripts/run_submission_pipeline.py validate
      - name: Save validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: submission-validation-${{ github.run_id }}
          path: reports/
