name: Publish Merged Leaderboard Submission

on:
  pull_request_target:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Merged PR number to retry'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

# Every Hub publisher uses this fixed group. GitHub queues up to 100 pending runs.
concurrency:
  group: leaderboard-publication
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted main scripts
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install trusted dependencies
        run: pip install -r trusted/.github/scripts/requirements.txt
      - name: Revalidate, publish atomically, and verify immutable readback
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python trusted/.github/scripts/run_submission_pipeline.py publish
      - name: Save publication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leaderboard-publication-${{ github.run_id }}
          path: reports/
